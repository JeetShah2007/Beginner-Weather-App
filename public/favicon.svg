<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <radialGradient id="auroraA" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#fb7185" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraB" cx="0.05" cy="0.95" r="0.75">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".7"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orb" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset=".55" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#a5f3fc" stop-opacity=".7"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset=".45" stop-color="#fb923c" stop-opacity=".7"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1e1b4b" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="32" fill="url(#base)"/>
  <rect width="128" height="128" rx="32" fill="url(#auroraA)"/>
  <rect width="128" height="128" rx="32" fill="url(#auroraB)"/>

  <circle cx="86" cy="46" r="46" fill="url(#halo)"/>
  <circle cx="86" cy="46" r="25" fill="url(#orb)"/>

  <g transform="translate(8 6)" filter="url(#shadow)">
    <path d="M36 94 a16 16 0 0 1 -2 -31.9 A24 24 0 0 1 80 66 a14 14 0 0 1 4 28 Z"
