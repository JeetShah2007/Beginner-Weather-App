  </g>

  <path d="M28 24 l2.2 5.8 5.8 2.2 -5.8 2.2 -2.2 5.8 -2.2 -5.8 -5.8 -2.2 5.8 -2.2z" fill="#fff" opacity=".9"/>
  <rect x=".75" y=".75" width="126.5" height="126.5" rx="31.25" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="1.5"/>
